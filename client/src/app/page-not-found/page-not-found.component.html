<section class="not-found" aria-labelledby="not-found-title">
  <img
    class="not-found__image"
    src="/assets/error.jpg"
    alt="">
  <div class="not-found__overlay" aria-hidden="true"></div>

  <div class="container not-found__content">
    <div class="not-found__panel">
      <p class="not-found__code" aria-hidden="true">404</p>
      <p class="not-found__eyebrow">Stránka nenalezena</p>
      <h1 id="not-found-title">Hledáme vaši stránku…</h1>
      <p class="not-found__message">
        Ale nemůžeme ji najít. Odkaz mohl být změněn nebo stránka už není dostupná.
      </p>
      <a
        class="not-found__action"
        routerLink="/"
        queryParamsHandling="preserve">
        <i class="fa fa-home" aria-hidden="true"></i>
        Zpět na úvodní stránku
      </a>
    </div>
  </div>
</section>
