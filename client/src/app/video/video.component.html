<div class="container">
  <div class="jumbotron">
    <h2 class="text-center web-color">Video</h2>
    <hr>

    @if (videosResource.hasValue()) {
      @let videos = videosResource.value();

      @if (videos.length) {
        <div class="row">
          @for (video of videos; track video.id) {
            <div class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-3 card-container">
              <div class="card">
                <a
                  data-fancybox
                  href="https://youtu.be/{{ video.youtube_id }}"
                  class="text-center"
                  title="{{ video.caption }}"
                  target="_blank">
                  @if (video.thumb) {
                    <img
                      class="card-img-top default"
                      src="{{ video.thumb }}"
                      alt="{{ video.caption }}">
                  } @else {
                    <span class="fa-stack fa-lg fa-4x">
                      <i class="fa fa-square-o fa-stack-2x web-color"></i>
                      <i class="fa fa-youtube fa-stack-1x text-danger"></i>
                    </span>
                  }
                </a>
                <div class="card-body">
                  <h5 class="card-title text-center">{{ video.caption }}</h5>
                </div>
              </div>
            </div>
          }
        </div>
      } @else {
        <div class="alert alert-danger text-center" role="alert">
          <strong>videa nenalezena</strong>
        </div>
      }
    } @else if (videosResource.error()) {
      <div class="alert alert-danger text-center" role="alert">
        <strong>neočekávaná chyba</strong>
      </div>
    } @else {
      <div class="spinner" role="status">
        <!--suppress HtmlUnknownTarget -->
        <img src="/assets/spinner_horizontal.svg" alt="Loading...">
      </div>
    }
  </div>
</div>
