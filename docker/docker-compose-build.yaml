name: "vcelnice-builder"
services:
  node:
    image: ${NODE_IMAGE:-node:24-bookworm-slim}
    volumes:
      - ../client:/app
    working_dir: /app
    command:
      - sh
      - -c
      - |
        echo "Starting Node build..."
        set -eu
        
        npm install -g npm@12.2.0
        npm ci --no-audit --no-fund
        npm run build
        test -s dist/index.html
        
        echo "Node build finished."
  python:
    image: ${PYTHON_IMAGE:-python:3.14-slim}
    volumes:
      - ..:/app
    working_dir: /app
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_SETTINGS_MODULE: config.settings.production
      PATH: "/opt/venv/bin:$PATH"
    depends_on:
      node:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - |
        set -eu
        DEBIAN_FRONTEND=noninteractive apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zip
        rm -rf /var/lib/apt/lists/*
        
        python -m venv /opt/venv
        . /opt/venv/bin/activate
        
        python -m pip install --upgrade pip
        python -m pip install -r ./requirements.txt
        
        echo "Node build should be complete by now, collecting static files"
        
        test -s client/dist/index.html
        python manage.py collectstatic --clear --noinput --settings=config.settings.production
        test -s staticfiles/client/index.html
        
        echo "Static files collected, zipping"
        
        rm --force vcelnice.zip
        zip -r vcelnice.zip . \
          -x ".git/*" \
          -x ".idea/*" \
          -x ".venv/*" \
          -x "client/.editorconfig" \
          -x "client/*.json" \
          -x "client/*.js" \
          -x "client/*.html" \
          -x "client/README.md" \
          -x "client/.angular/*" \
          -x "client/dist/*" \
          -x "client/e2e/*" \
          -x "client/src/*" \
          -x "client/node_modules/*" \
          -x "config/settings/development.py" \
          -x "config/settings/testing.py" \
          -x "logs/*" \
          -x "media/*" \
          -x "video/tests/*" \
          -x "*/__pycache__/*" \
          -x "*/tests/*" \
          -x "docker/*" \
          -x ".coverage" \
          -x ".coveragerc" \
          -x ".env.tmpl" \
          -x ".dockerignore" \
          -x ".gitignore" \
          -x ".nvmrc" \
          -x "requirements*.txt" \
          -x "*.sqlite3" \
          -x "config/asgi.py" \
          -x "config/wsgi.py" \
          -x "README.md"
